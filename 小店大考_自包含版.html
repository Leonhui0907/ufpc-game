<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小店大考 · 单人经营模拟</title>
<meta name="theme-color" content="#123a6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="#123a6b">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏪</text></svg>">
<style>
  :root{
    --navy:#123a6b; --navy-d:#0d2b50; --blue:#2f6fb5; --blue-l:#5b9be0;
    --ink:#123a6b; --ink-l:#5b7ba0; --paper:#ffffff; --paper-2:#f4f8fd;
    --line:#dbe6f3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1200px 700px at 80% -10%, #eaf2fb 0%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg,#f6f9fd 0%,#eef4fb 100%);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:20px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%; max-width:640px; background:var(--paper);
    border:1px solid var(--line); border-radius:18px;
    box-shadow:0 18px 48px -24px rgba(13,43,80,.28); overflow:hidden; position:relative;
  }
  header{padding:22px 26px 18px; border-bottom:1px solid var(--line); background:linear-gradient(135deg,#ffffff,#f4f8fd)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:.5px}
  .brand-text{font-size:12px;letter-spacing:2px;color:var(--ink-l);text-transform:uppercase}
  .title{font-size:22px;font-weight:700;letter-spacing:.5px;color:var(--navy)}
  .sub{font-size:12.5px;color:var(--ink-l);margin-top:2px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;position:relative;overflow:hidden}
  .stat .lbl{font-size:11px;letter-spacing:1px;color:var(--ink-l);display:flex;align-items:center;gap:5px}
  .stat .ic{font-size:11px}
  .stat .val{font-size:21px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
  .stat .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--blue-l);transition:width .5s ease}
  .stat.money .bar{background:#2f6fb5}
  .stat.rep .bar{background:#5b9be0}
  .stat.soc .bar{background:#7ab6e8}
  main{padding:24px 26px 28px;min-height:320px}
  .day-tag{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:1.5px;color:var(--blue);
    background:#eaf2fb;border:1px solid #d3e3f5;padding:5px 11px;border-radius:20px;margin-bottom:14px;font-weight:600}
  .day-tag .dot{width:5px;height:5px;border-radius:50%;background:var(--blue)}
  h2.scene-title{font-size:19px;font-weight:700;color:var(--navy);line-height:1.5;margin-bottom:6px}
  p.desc{font-size:14.5px;color:#3c5576;margin-bottom:20px}
  .flags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .flag{font-size:11.5px;color:var(--navy);background:#f0f6ff;border:1px dashed #bcd5ef;padding:4px 10px;border-radius:8px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 15px;
    font-family:inherit;color:var(--ink);transition:all .16s ease;position:relative}
  .opt:hover{border-color:var(--blue-l);transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(47,111,181,.35)}
  .opt:active{transform:translateY(0)}
  .opt:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .opt .key{flex:0 0 auto;width:23px;height:23px;border-radius:7px;background:#eaf2fb;color:var(--navy);
    font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px;border:1px solid #d3e3f5}
  .opt .tx{flex:1}
  .opt .hd{font-size:14.5px;font-weight:600;color:var(--navy);margin-bottom:3px}
  .opt .fl{font-size:12.5px;color:#5b7ba0}
  .opt .fx{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .fx span{font-size:10.5px;padding:2px 7px;border-radius:6px;background:#f4f8fd;color:var(--ink-l);border:1px solid var(--line)}
  .fx span.g{color:#1f7a63;background:#eef8f5;border-color:#cfe9e1}
  .fx span.r{color:#b3544a;background:#fdf1ef;border-color:#f4dcd7}
  .fx span.b{color:var(--blue);background:#eef4fc;border-color:#d6e5f5}
  .ending{text-align:center;padding:6px 0 4px}
  .ending .badge{font-size:12px;letter-spacing:3px;color:var(--blue);font-weight:600}
  .ending h3{font-size:26px;font-weight:800;color:var(--navy);margin:8px 0 4px}
  .ending .emoji{font-size:40px;line-height:1.1}
  .ending .story{font-size:14.5px;color:#3c5576;margin:14px 0 20px}
  .rec{border:1px solid var(--line);border-radius:13px;padding:15px;text-align:left;
    background:linear-gradient(135deg,#f4f8fd,#fff);margin-bottom:18px}
  .rec .t{font-size:11.5px;letter-spacing:1px;color:var(--ink-l);margin-bottom:6px}
  .rec .m{font-size:14.5px;font-weight:600;color:var(--navy)}
  .rec .d{font-size:12.5px;color:#5b7ba0;margin-top:5px}
  .rec-tip{font-size:12px;color:var(--blue);text-align:center;margin:-6px 0 18px;font-weight:600}
  .path-box{font-size:12px;color:var(--ink-l);background:#f4f8fd;border:1px dashed var(--line);
    border-radius:9px;padding:10px 12px;margin:0 0 18px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:10px}
  .btn{flex:1;cursor:pointer;border-radius:11px;padding:13px;font-family:inherit;font-size:14px;font-weight:600;
    border:1px solid var(--navy);transition:all .16s}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.primary:hover{background:var(--navy-d)}
  .btn.ghost{background:#fff;color:var(--navy)}
  .btn.ghost:hover{background:#f4f8fd}
  .cover{padding:8px 0}
  .cover .hero{font-size:30px;font-weight:800;color:var(--navy);line-height:1.35}
  .cover .lead{font-size:14.5px;color:#3c5576;margin:12px 0 20px}
  .rules{text-align:left;border:1px solid var(--line);border-radius:13px;padding:16px 18px;background:#fafcff;margin-bottom:20px}
  .rules h4{font-size:13px;letter-spacing:1px;color:var(--navy);margin-bottom:10px}
  .rules li{font-size:13px;color:#3c5576;margin-bottom:7px;padding-left:2px}
  .rules b{color:var(--navy)}
  .final-stats{display:flex;gap:10px;margin-bottom:6px}
  .final-stats .stat{flex:1;text-align:center;padding:14px 8px}
  footer{font-size:11px;color:#8aa2c0;text-align:center;padding:0 26px 20px;letter-spacing:.5px}
  .err{color:#b3544a;font-size:13px;text-align:center;padding:20px}
  .join-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:linear-gradient(135deg,#f4f8fd,#fff);margin:0 0 18px;text-align:center}
.join-card .join-head{margin-bottom:12px}
.join-name{font-size:15px;font-weight:700;color:var(--navy)}
.join-no{font-size:12px;color:var(--ink-l);margin-top:2px;font-variant-numeric:tabular-nums}
.join-qr{width:100%;max-width:250px;height:auto;display:block;margin:0 auto;border-radius:8px;background:#fff}
.fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

function clamp(n){ return Math.max(0, Math.round(n)); }
function fxText(f){
  var map={money:['资金',''], rep:['口碑',''], soc:['社会值','']};
  var k=f[0], sign=f[1], name=map[k][0], v=f[1];
  var num=parseInt(v,10);
  var cls = (k==='money') ? 'b' : (num>0 ? 'g' : (num<0 ? 'r' : ''));
  var show = (v==='0') ? '不变' : (sign==='+' ? '+'+v : (sign==='-' ? '\u2212'+Math.abs(num)+map[k][1] : v));
  return [name, show, cls];
}
function applyOpt(o){
  var fi=o.fx.filter(function(x){return x[0]==='money';});
  S.money = clamp(S.money + parseInt((fi.length?fi[0][1]:'0'),10));
  var fr=o.fx.filter(function(x){return x[0]==='rep';});
  S.rep = clamp(S.rep + parseInt((fr.length?fr[0][1]:'0'),10));
  var fs=o.fx.filter(function(x){return x[0]==='soc';});
  S.soc = clamp(S.soc + parseInt((fs.length?fs[0][1]:'0'),10));
  if(o.key==='D' && o.fx.some(function(x){return x[0]==='rep'&&x[1]==='\u00b1口碑两极';})){
    S.repFlip += 1;
    S.rep = clamp(S.rep + (Math.random()>0.5?12:-8));
  }
  if(o.flag && S.flags.indexOf(o.flag)<0) S.flags.push(o.flag);
  S.path.push(o.key);
}
function getEnding(){
  for(var i=0;i<ENDINGS.length;i++){ if(ENDINGS[i].cond(S)) return ENDINGS[i]; }
  return ENDINGS[ENDINGS.length-1];

    + '<h3>'+esc(e.title)+'</h3>'
    + '<p class="story">'+esc(e.story)+'</p>'
    + '<div class="rec"><div class="t">你的结局说明 →</div><div class="m">'+esc(e.rec.m)+'</div><div class="d">'+esc(e.rec.d)+'</div></div>'
    + '<div class="rec-tip">扫码加入 UFPC 社会商道，告诉我们你的结局 👇</div>'
    + '<div class="path-box">你的决策：'+esc(path)+'</div>'
    + '<div class="btns"><button class="btn ghost" data-act="share">分享我的结局</button><button class="btn primary" data-act="join">加入我们</button></div>'
    + '<div class="join-card" id="joinCard" style="display:none">'
    +   '<div class="join-head"><div class="join-name">UFPC 社会商道</div><div class="join-no">群号 124711059</div></div>'
    +   '<img class="join-qr" src="'+JOIN_QR+'" alt="UFPC 社会商道 招新群二维码">'
    +   '<button class="btn ghost" data-act="closeJoin" style="margin-top:2px">收起二维码</button>'
    + '</div>'
    + '<div class="btns" style="margin-top:10px"><button class="btn ghost" data-act="restart">再来一局</button></div>'
    + '</div></main>'
    + '<footer>UFPC 社会商道 · 你的选择，就是你的商业观</footer>';
}

var TPL = {start:TPLStart, d14:TPLResult};
SCENARIOS.forEach(function(s){ TPL[s.key]=TPLScene; });

var app = document.getElementById('app');
function render(){
  var el = document.createElement('div');
  el.className = 'fade';
  try{ el.innerHTML = TPL[S.scene](); }
  catch(err){ el.innerHTML = '<main class="err">加载出错：'+esc(err.message)+'</main>'; }
  app.innerHTML = '';
  app.appendChild(el);
  bind();
}
function bind(){
  app.querySelectorAll('[data-act]').forEach(function(b){
    b.addEventListener('click',function(){
      var a=b.dataset.act;
      if(a==='start'){ S.scene='d1'; render(); }
      if(a==='restart'){ S={money:3000,rep:50,soc:0,repFlip:0,flags:[],path:[],scene:'start'}; render(); }
      if(a==='join'||a==='closeJoin'){
        var card=document.getElementById('joinCard');
        if(card) card.style.display = (a==='join') ? 'block' : 'none';
        try{ if(a==='join'&&JOIN_FALLBACK) window.open(JOIN_FALLBACK,'_blank'); }catch(e){}
      }
      if(a==='share'){
        var txt=SHARE_TEXT(getEnding());
        var done=function(){ var bb=app.querySelector('[data-act="restart"]'); if(bb) bb.textContent='已复制，去粘贴吧 ✔'; };
        try{
          if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done,fb); }
          else fb();
        }catch(err){ fb(); }
        function fb(){
          var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.select();
          try{ document.execCommand('copy'); done(); }catch(e){}
          ta.remove();
        }
      }
    });
  });
  app.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click',function(){
      var key=b.dataset.key;
      var i=0;
      for(var k=0;k<SCENARIOS.length;k++){ if(SCENARIOS[k].key===S.scene){ i=k; break; } }
      var scene=SCENARIOS[i];
      var o=scene.opts.filter(function(x){return x.key===key;})[0];
      if(!o) return;
      applyOpt(o);
      var forceEnd = (S.money<=0) && (o.next==='d14' || SCENARIOS[SCENARIOS.length-1].key===S.scene);
      var next = forceEnd ? 'd14' : o.next;
      S.scene = next;
      if(S.scene==='d14') S.money = clamp(S.money);
      render();
    });
  });
}
render();
</script>
</body>
</html>
